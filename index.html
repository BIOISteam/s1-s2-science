<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="S1-S2 Integrated Science interactive learning platform">
    <title>S1-S2 Integrated Science | Interactive Learning Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/bio-hub.css">
  </head>
  <body class="bio-hub-app">
    <nav class="global-nav" id="global-nav" aria-label="Main navigation">
      <div class="nav-brand-section">
        <a href="#" class="nav-logo-link" data-page="table" aria-label="S1-S2 Integrated Science home">
          <img src="./images/uni-plus-logo.png" class="nav-logo" alt="UNI+ logo">
        </a>
        <a href="#" class="nav-brand" data-page="table">S1-S2 Integrated Science</a>
      </div>

      <div class="nav-center-group">
        <div class="global-nav-pill">
          <button class="nav-pill-btn active" type="button" data-page="table">Slides</button>
          <button class="nav-pill-btn" type="button" data-page="ions">Notes</button>
          <button class="nav-pill-btn" type="button" data-page="tools">Virtual Lab</button>
          <button class="nav-pill-btn" type="button" data-page="worksheet">Flashcards</button>
          <button class="nav-pill-btn" type="button" data-page="settings">Tests</button>
          <button class="nav-pill-btn" type="button" data-page="inclasstest">Class Tests</button>
          <button class="nav-pill-btn" type="button" data-page="comics">Comics</button>
        </div>
      </div>

      <div class="nav-right-section">
        <button class="lang-dropdown-toggle" type="button" aria-label="Change language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3c-2.4 2.5-3.6 5.5-3.6 9S9.6 18.5 12 21" />
          </svg>
          <span>EN</span>
        </button>
      </div>
    </nav>

    <main class="app-pages">
    <section id="table-page" class="blank-page bio-hub-page active" data-page-panel="table">
      <iframe class="bio-hub-frame" src="./hubs/slides.html" title="Slides"></iframe>
    </section>
    <section id="ions-page" class="blank-page bio-hub-page" data-page-panel="ions">
      <iframe class="bio-hub-frame" src="./hubs/notes.html" title="Notes"></iframe>
    </section>
    <section id="blank-page-1" class="blank-page bio-hub-page" data-page-panel="tools">
      <iframe class="bio-hub-frame" src="./hubs/lab.html" title="Virtual Lab"></iframe>
    </section>
    <section id="blank-page-2" class="blank-page bio-hub-page" data-page-panel="worksheet">
      <iframe class="bio-hub-frame" src="./hubs/flashcards.html" title="Flashcards"></iframe>
    </section>
    <section id="settings-page" class="blank-page bio-hub-page" data-page-panel="settings">
      <iframe class="bio-hub-frame" src="./hubs/quiz-hub.html" title="Tests"></iframe>
    </section>
    <section id="inclasstest-page" class="blank-page bio-hub-page" data-page-panel="inclasstest">
      <iframe class="bio-hub-frame" src="./hubs/in-class-test-hub.html" title="Class Tests"></iframe>
    </section>
    <section id="comics-page" class="blank-page bio-hub-page" data-page-panel="comics">
      <iframe class="bio-hub-frame" src="./hubs/comics.html" title="Comics"></iframe>
    </section>
    </main>

    <script src="./script.js" defer></script>
  </body>
</html>
