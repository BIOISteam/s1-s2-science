<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slides | S1-S2 Integrated Science</title>
  <link rel="stylesheet" href="../css/hub-tokens.css">
  <link rel="stylesheet" href="../css/tools.css">
  <link rel="stylesheet" href="css/tools-hub.css">
  <link rel="stylesheet" href="css/quiz-hub.css">
  <link rel="stylesheet" href="css/embed.css">
  <script src="embed.js"></script>
</head>
<body class="bio-tools-hub">
  <div class="bio-tools-hub-root chemistry-tools-page">
    <div class="chem-tools-container">
      <h1 class="chem-tools-title">Slides</h1>
      <p class="chem-tools-subtitle">Classroom fast notes — open PDF notes for revision.</p>

      <div class="quiz-chapter-grid quiz-chapter-grid--compact" role="list">
        <div
          class="quiz-chapter-card quiz-chapter-card--compact"
          data-href="./notes-viewer.html"
          role="listitem"
          tabindex="0"
        >
          <div class="quiz-chapter-preview quiz-chapter-preview--ch3 quiz-chapter-preview--photo" aria-hidden="true">
            <span class="quiz-chapter-preview-label quiz-chapter-preview-label--ch3">Ch 1</span>
          </div>
          <div class="quiz-chapter-info">
            <h2 class="quiz-chapter-name">Chapter 1 — Introduction to Science</h2>
            <p class="quiz-chapter-desc">
              Scientific investigation, variables, lab safety, apparatus, measurement, Bunsen burner, and branches of science.
            </p>
            <div class="quiz-chapter-meta">
              <span class="quiz-chapter-badge">7 notes</span>
              <span class="quiz-chapter-cta">Open notes →</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="hub-common.js"></script>
</body>
</html>
