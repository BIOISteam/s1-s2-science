<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes Viewer | S1-S2 Integrated Science</title>
  <link rel="stylesheet" href="../css/hub-tokens.css">
  <link rel="stylesheet" href="css/viewer.css">
  <script src="embed.js"></script>
</head>
<body class="notes-viewer-page">
  <header class="viewer-header">
    <a class="viewer-back" href="./notes.html">← Back to notes</a>
    <label class="viewer-select-wrap">
      Select note
      <select id="note-select" class="viewer-select"></select>
    </label>
  </header>
  <main class="viewer-main">
    <h1 id="note-title" class="viewer-title"></h1>
    <embed id="note-pdf" class="viewer-pdf" type="application/pdf" title="PDF note viewer" />
    <p class="viewer-fallback">
      PDF not showing?
      <a id="note-open-link" href="#" target="_blank" rel="noopener noreferrer">Open in a new tab</a>
    </p>
  </main>
  <script src="notes-viewer.js"></script>
</body>
</html>
