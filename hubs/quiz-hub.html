<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz | S1-S2 Integrated Science</title>
  <link rel="stylesheet" href="../css/hub-tokens.css">
  <link rel="stylesheet" href="../css/tools.css">
  <link rel="stylesheet" href="css/tools-hub.css">
  <link rel="stylesheet" href="css/quiz-hub.css">
  <link rel="stylesheet" href="css/embed.css">
  <script src="embed.js"></script>
</head>
<body class="bio-tools-hub">
  <div class="bio-tools-hub-root chemistry-tools-page">
    <div class="chem-tools-container">
      <h1 class="chem-tools-title">Quiz</h1>
      <p class="chem-tools-subtitle">Concept checks by chapter.</p>

      <div class="quiz-chapter-grid quiz-chapter-grid--compact" role="list">
        <div
          class="quiz-chapter-card quiz-chapter-card--compact quiz-chapter-card--ch2"
          data-href="../quiz/ch1/quiz.html"
          role="listitem"
          tabindex="0"
        >
          <div class="quiz-chapter-preview quiz-chapter-preview--ch2" aria-hidden="true">
            <span class="quiz-chapter-preview-label quiz-chapter-preview-label--ch2">Ch 1</span>
          </div>
          <div class="quiz-chapter-info">
            <h2 class="quiz-chapter-name">Chapter 1</h2>
            <p class="quiz-chapter-desc">
              Scientific investigation steps and variables (1.1 &amp; 1.2).
            </p>
            <div class="quiz-chapter-meta">
              <span class="quiz-chapter-badge quiz-chapter-badge--ch2">10 MCQ</span>
              <span class="quiz-chapter-cta">Start quiz →</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="hub-common.js"></script>
</body>
</html>
